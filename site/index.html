<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d16">
  <title>VPN Infrastructure Explorer</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div class="shell">
    <header class="topbar">
      <label class="search"><span class="search-icon">⌕</span><input id="search" placeholder="Поиск по сервису, локации, IP или ASN…"><kbd>Ctrl K</kbd><button id="clearSearch" aria-label="Очистить">×</button></label>
      <a class="download-all" id="downloadAll" href="../VPN-13-services.zip">Скачать всё <span>↗</span></a>
    </header>
    <main class="canvas-viewport" id="canvasViewport"><div class="canvas-world" id="canvasWorld"><svg class="connections" id="connections" aria-hidden="true"></svg><div class="canvas-nodes" id="canvasNodes"></div></div></main>
  </div>
  <div class="modal" id="modal" aria-hidden="true"><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-window"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></div></div>
  <div class="toast" id="toast"></div>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
